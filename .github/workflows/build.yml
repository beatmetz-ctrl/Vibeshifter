name: Build Vibeshifter

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-windows:
    name: Build Windows (VST3 & Standalone)
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build Targets
      run: cmake --build build --config Release --target Vibeshifter_VST3 Vibeshifter_Standalone

    - name: Upload VST3 Plugin
      uses: actions/upload-artifact@v4
      with:
        name: Vibeshifter-VST3-Windows
        path: build/Vibeshifter_artefacts/Release/VST3/
        if-no-files-found: error

    - name: Upload Standalone App
      uses: actions/upload-artifact@v4
      with:
        name: Vibeshifter-Standalone-Windows
        path: build/Vibeshifter_artefacts/Release/Standalone/
        if-no-files-found: warn
