name: Build VST3 Plugin (VibeShifter)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-vst3:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: VibeShifter-Windows-VST3
            vst3_path: build/VibeShifter_artefacts/Release/VST3/VibeShifter.vst3
          - os: macos-latest
            artifact_name: VibeShifter-macOS-VST3
            vst3_path: build/VibeShifter_artefacts/Release/VST3/VibeShifter.vst3

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3
        run: cmake --build build --config Release --target VibeShifter_VST3 -j 4

      - name: Upload VST3 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.vst3_path }}
          if-no-files-found: error
